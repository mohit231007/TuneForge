name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install "ruff>=0.8"

      - name: Ruff
        run: ruff check src tests app api

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install CPU PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pytest
        run: pytest -q

  web-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install web dependencies
        run: npm install

      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build Next.js app
        run: npm run build


  public-api-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: public_api

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install public API test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest httpx pip-audit

      - name: Audit public API Python dependencies
        run: pip-audit

      - name: Test public API
        run: pytest -q
