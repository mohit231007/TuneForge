[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tuneforge"
version = "0.1.0"
description = "Reproducible LoRA fine-tuning, adapter persistence, and comparative evaluation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.5",
  "transformers>=4.47",
  "datasets>=3.0",
  "peft>=0.14",
  "trl>=0.12",
  "accelerate>=1.0",
  "pyyaml>=6.0",
  "pandas>=2.0",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "python-multipart>=0.0.12",
  "requests>=2.32"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
